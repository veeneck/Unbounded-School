<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/unbounded-logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#166534">
  <meta name="apple-mobile-web-app-title" content="Unbounded School">
  <meta name="application-name" content="Unbounded School">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Transcripts — Juliet | Unbounded School</title>
  <link rel="stylesheet" href="../../styles.css">
      <!-- Fathom - beautiful, simple website analytics -->
      <script src="https://cdn.usefathom.com/script.js" data-site="FXWFKUXE" defer></script>
      <!-- / Fathom -->
</head>
<body>
  <nav class="site-nav" id="site-nav" aria-label="Main">
    <div class="nav-inner">
      <a class="nav-logo" href="../../index.html">
        <img src="../../unbounded-logo.svg" alt="Unbounded School" width="42" height="42">
        <span>Unbounded School</span>
      </a>
      <ul class="nav-links">
        <li><a href="/schedule">Schedule</a></li>
        <li class="nav-drop">
          <button type="button" class="nav-drop-btn" aria-expanded="false" aria-haspopup="true">
            Guides
            <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="nav-dropdown" role="menu">
            <a href="/guides/grok-and-quill.html" role="menuitem">Grok &amp; Quill</a>
            <a href="/guides/quarterly-coin.html" role="menuitem">Quarterly Coin</a>
          </div>
        </li>
        <li class="nav-drop">
          <button type="button" class="nav-drop-btn" aria-expanded="false" aria-haspopup="true">
            Students
            <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="nav-dropdown" role="menu">
            <a href="/students/scarlett/transcripts.html" role="menuitem">Scarlett</a>
            <a class="active" href="/students/juliet/transcripts.html" role="menuitem">Juliet</a>
          </div>
        </li>
      </ul>
    </div>
  </nav>

  <div class="page">
    <header>
      <div class="hero-badge">Student Record</div>
      <h1>Juliet’s Transcripts</h1>
      <p class="subtitle">Progress, scores, reading, projects, and more.</p>
    </header>

    <section>
      <div class="subject-card" style="text-align:center; padding:2.5rem 1.5rem;">
        <p style="font-size:1.15rem; font-weight:650; margin:0 0 0.4rem; color:var(--ink);">Coming soon</p>
        <p style="margin:0; color:var(--muted); font-size:0.95rem;">Juliet’s transcript will appear here as her work is added.</p>
      </div>
    </section>

    <footer>
      Unbounded School · Juliet
    </footer>
  </div>

  <script>
    (function () {
      const nav = document.getElementById('site-nav');
      const THRESHOLD = 200;
      function updateNav() {
        if (window.scrollY > THRESHOLD) nav.classList.add('nav-away');
        else nav.classList.remove('nav-away');
      }
      window.addEventListener('scroll', updateNav, { passive: true });
      updateNav();

      document.querySelectorAll('.nav-drop').forEach(function (drop) {
        const btn = drop.querySelector('.nav-drop-btn');
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          const open = drop.classList.toggle('open');
          btn.setAttribute('aria-expanded', open ? 'true' : 'false');
          document.querySelectorAll('.nav-drop').forEach(function (other) {
            if (other !== drop) {
              other.classList.remove('open');
              other.querySelector('.nav-drop-btn').setAttribute('aria-expanded', 'false');
            }
          });
        });
      });
      document.addEventListener('click', function () {
        document.querySelectorAll('.nav-drop').forEach(function (drop) {
          drop.classList.remove('open');
          drop.querySelector('.nav-drop-btn').setAttribute('aria-expanded', 'false');
        });
      });
    })();
  </script>
</body>
</html>
