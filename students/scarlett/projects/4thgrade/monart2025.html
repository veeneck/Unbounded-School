  <script>
    (function () {
      const nav = document.getElementById('site-nav');
      const THRESHOLD = 200;
      function updateNav() {
        if (window.scrollY > THRESHOLD) nav.classList.add('nav-away');
        else nav.classList.remove('nav-away');
      }
      window.addEventListener('scroll', updateNav, { passive: true });
      updateNav();
      document.querySelectorAll('.nav-drop').forEach(function (drop) {
        const btn = drop.querySelector('.nav-drop-btn');
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          const open = drop.classList.toggle('open');
          btn.setAttribute('aria-expanded', open ? 'true' : 'false');
          document.querySelectorAll('.nav-drop').forEach(function (other) {
            if (other !== drop) {
              other.classList.remove('open');
              other.querySelector('.nav-drop-btn').setAttribute('aria-expanded', 'false');
            }
          });
        });
      });
      document.addEventListener('click', function () {
        document.querySelectorAll('.nav-drop').forEach(function (drop) {
          drop.classList.remove('open');
          drop.querySelector('.nav-drop-btn').setAttribute('aria-expanded', 'false');
        });
      });
    })();
  </script>
