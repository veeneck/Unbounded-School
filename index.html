<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/unbounded-logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#166534">
  <meta name="apple-mobile-web-app-title" content="Unbounded School">
  <meta name="application-name" content="Unbounded School">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Unbounded School</title>
  <link rel="stylesheet" href="styles.css">
      <!-- Fathom - beautiful, simple website analytics -->
      <script src="https://cdn.usefathom.com/script.js" data-site="FXWFKUXE" defer></script>
      <!-- / Fathom -->
</head>
<body class="page-home">
  <main class="home-hero">
    <div class="home-hero-inner">
      <img class="home-logo" src="unbounded-logo.svg" alt="Unbounded School" width="288" height="288">
      <h1 class="home-title">Unbounded School</h1>
      <p class="home-tagline">A different take on education.</p>
      <nav class="home-bubbles" aria-label="Site">
        <a class="home-bubble" href="schedule.html">Schedule</a>
        <a class="home-bubble" href="coop.html">Co-op</a>
        <div class="home-bubble-drop">
          <button type="button" class="home-bubble" aria-expanded="false" aria-haspopup="true">
            Guides
            <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="home-bubble-menu" role="menu">
            <a href="guides/grok-and-quill.html" role="menuitem">Grok &amp; Quill</a>
            <a href="guides/quarterly-coin.html" role="menuitem">Quarterly Coin</a>
            <a href="guides/travel-crier.html" role="menuitem">Travel Crier</a>
            <a href="guides/info-quest.html" role="menuitem">Info Quest</a>
            <a href="guides/bakers-guild.html" role="menuitem">Bakers Guild</a>
            <a href="guides/housewright.html" role="menuitem">Housewright</a>
          </div>
        </div>
      </nav>
    </div>
    <a class="home-ball-link" href="riddle/index.html" aria-label="Daily riddle"></a>
  </main>
  <script>
    (function () {
      document.querySelectorAll('.home-bubble-drop').forEach(function (drop) {
        const btn = drop.querySelector('button.home-bubble');
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          const open = drop.classList.toggle('open');
          btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        });
      });
      document.addEventListener('click', function () {
        document.querySelectorAll('.home-bubble-drop').forEach(function (drop) {
          drop.classList.remove('open');
          const btn = drop.querySelector('button.home-bubble');
          if (btn) btn.setAttribute('aria-expanded', 'false');
        });
      });

      var ball = document.querySelector('.home-ball-link');
      if (ball) {
        var IMG_W = 1792;
        var IMG_H = 1008;
        var CX = 740;
        var CY = 820;
        var R = 100;
        function placeBall() {
          var vw = window.innerWidth;
          var vh = window.innerHeight;
          var scale = Math.max(vw / IMG_W, vh / IMG_H);
          var size = R * 2 * scale;
          var left = (vw - IMG_W * scale) / 2 + CX * scale - size / 2;
          var top = (vh - IMG_H * scale) / 2 + CY * scale - size / 2;
          ball.style.width = size + 'px';
          ball.style.height = size + 'px';
          ball.style.left = left + 'px';
          ball.style.top = top + 'px';
        }
        placeBall();
        window.addEventListener('resize', placeBall);
      }
    })();
  </script>
</body>
</html>
